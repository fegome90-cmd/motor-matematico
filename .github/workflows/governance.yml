# Adaptado de Code Dope; procedencia en docs/github/reuse-audit.md.
name: Repository governance

on:
  pull_request:
    branches: [developer, tester, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [developer, tester, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: PR branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - name: Verify promotion policy
        run: node --test scripts/check-pr-route.test.mjs
      - name: Check this pull request
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-route.mjs

  secrets:
    name: Secrets and private paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash scripts/check-secrets.sh history
      - run: node --test scripts/scan-staged-secrets.test.mjs

  docs:
    name: Documentation links and references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - run: node scripts/check-docs.mjs
